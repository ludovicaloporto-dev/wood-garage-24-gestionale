<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Wood Garage 24 — Gestionale</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--text:#171717;--muted:#6b6b6b;--line:#ddd;--dark:#111;--soft:#f8f8f8;--warn:#fff2c7;--ok:#eaf7ea;--danger:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px #0002}
header img{height:55px;width:auto;max-width:110px;object-fit:contain}.brand-title{font-size:18px;font-weight:800}.brand-sub{opacity:.68;font-size:12px;margin-top:3px}
main{max-width:1180px;margin:auto;padding:18px}
nav{display:flex;gap:7px;overflow:auto;margin-bottom:16px;padding-bottom:2px}nav button{white-space:nowrap}
button{border:1px solid #ccc;background:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}button:hover{filter:brightness(.98)}
button.active,button.primary{background:var(--dark);color:#fff;border-color:var(--dark)}button.danger{color:var(--danger);border-color:#e2b3b0;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfcfcf;border-radius:10px;font:inherit;background:#fff}textarea{resize:vertical}
label{font-size:13px;font-weight:700;display:block}.muted{color:var(--muted);font-size:14px}.big{font-size:25px;font-weight:800}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;border-radius:999px;background:#eee;padding:5px 9px;font-size:12px;font-weight:700}.warn{background:var(--warn);border-color:#e3c86b}.ok{background:var(--ok);border-color:#b7d9b7}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}.right{text-align:right}
.scroll{overflow:auto}.article{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:#fafafa}
.item-grid{display:grid;grid-template-columns:2fr .7fr 1fr 1fr;gap:10px}.thumb{width:110px;height:110px;border:1px dashed #bbb;border-radius:10px;object-fit:contain;background:#fff}
.preview-wrap{position:relative;display:inline-block}.preview-wrap img{display:block;max-width:100%;max-height:360px;border-radius:10px}.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:28px;font-weight:800;color:#111;opacity:.22;transform:rotate(-25deg);letter-spacing:2px}
.logo-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.20}.logo-watermark img{width:45%;max-height:45%;object-fit:contain}
.stat{min-height:104px}.click{cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted)}
.small{font-size:12px}.hidden{display:none!important}
.toast{position:fixed;right:16px;bottom:16px;background:#111;color:#fff;padding:12px 15px;border-radius:12px;z-index:50;box-shadow:0 5px 25px #0003}
.modal{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}.modal-box{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px}
hr{border:0;border-top:1px solid #eee;margin:16px 0}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.item-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){header{padding:8px 12px}header img{height:45px;max-width:85px}.brand-title{font-size:15px}main{padding:11px}.grid,.grid2,.item-grid{grid-template-columns:1fr}.card{padding:13px}.big{font-size:22px}th,td{padding:8px}}\n@media print{body{background:#fff!important}header,#nav,button,input,select,textarea,.actions,.no-print{display:none!important}main{max-width:none!important;padding:0!important}.card{border:0!important;box-shadow:none!important;margin:0 0 12px!important;padding:8px!important}.print-order{break-inside:avoid-page;border-bottom:2px solid #111;padding:0 0 18px;margin:0 0 18px}.print-order:last-child{border-bottom:0}@page{size:A4;margin:14mm}}
</style>
<style>
.graphic-box{margin-top:12px;padding:12px;border:1px dashed #bbb;border-radius:12px;background:#fafafa}
.graphic-preview{position:relative;display:inline-block;max-width:260px;margin-top:8px}
.graphic-preview img{display:block;max-width:260px;max-height:220px;border-radius:8px}
.graphic-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.78);text-shadow:0 1px 3px rgba(0,0,0,.7);transform:rotate(-25deg);pointer-events:none}
</style></head>
<body>
<header>
  <img src="logo.png" alt="Wood Garage 24">
  <div><div class="brand-title">WOOD GARAGE 24</div><div class="brand-sub">Gestionale ordini · magazzino · cassa · margini</div></div>
</header>
<main>
<nav id="nav"></nav>
<section id="app"></section>
</main>
<div id="modal" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://fwrnklssnxnfiigiswzu.supabase.co";
const SUPABASE_KEY="sb_publishable_6sXvorsx0MIhqMKof-vQZA_MM1PyZM9";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let db={products:[],orders:[],clients:[],movements:[],settings:{watermarkMode:"logo",watermark:"WOOD GARAGE 24"}};
let currentUser=null, currentView="home", editingOrderId=null;

const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const num=v=>Number(String(v??"").trim().replace(",", "."))||0;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function fail(e){console.error(e);alert(e?.message||String(e))}
function goNav(v){currentView=v;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));({home,orders,stock,cash,clients,backup}[v]||home)()}

$("nav").innerHTML=[
 ["home","🏠 Home"],["orders","🧾 Ordini"],["stock","📦 Magazzino"],["cash","💰 Cassa"],["clients","👥 Clienti"],["backup","⚙️ Dati"]
].map(x=>`<button type="button" data-v="${x[0]}" onclick="goNav('${x[0]}')">${x[1]}</button>`).join("");

function authScreen(){
 $("nav").innerHTML="";
 $("app").innerHTML=`<div style="max-width:460px;margin:50px auto">
 <div class="card" style="text-align:center">
 <img src="logo.png" style="width:180px;max-height:120px;object-fit:contain" alt="Wood Garage 24">
 <h1 style="margin:0 0 5px">Wood Garage 24</h1>
 <div class="muted" style="margin-bottom:20px">Gestionale online</div>
 <div id="authMsg" class="small" style="margin-bottom:10px"></div>
 <label style="text-align:left">Email<input id="authEmail" type="email" autocomplete="email" placeholder="La tua email"></label>
 <label style="text-align:left;margin-top:10px">Password<input id="authPassword" type="password" autocomplete="current-password" placeholder="Minimo 6 caratteri"></label>
 <div class="actions" style="justify-content:center">
   <button type="button" class="primary" onclick="login()">Accedi</button>
   <button type="button" onclick="signup()">Crea account</button>
 </div>
 </div></div>`;
}
function authMsg(m){$("authMsg").textContent=m}
async function login(){
 try{
  const email=$("authEmail").value.trim(),password=$("authPassword").value;
  if(!email||!password)return authMsg("Inserisci email e password.");
  const r=await sb.auth.signInWithPassword({email,password});
  if(r.error)return authMsg(r.error.message);
  currentUser=r.data.user;await boot();
 }catch(e){authMsg(e.message)}
}
async function signup(){
 try{
  const email=$("authEmail").value.trim(),password=$("authPassword").value;
  if(!email||password.length<6)return authMsg("Inserisci email e password (minimo 6 caratteri).");
  const r=await sb.auth.signUp({email,password});
  if(r.error)return authMsg(r.error.message);
  if(r.data.session){currentUser=r.data.user;await boot()}
  else authMsg("Account creato. Controlla la tua email e poi accedi.");
 }catch(e){authMsg(e.message)}
}
async function signout(){await sb.auth.signOut();currentUser=null;authScreen()}

async function loadOnline(){
 const [p,c,o,m]=await Promise.all([
  sb.from("products").select("*").order("name"),
  sb.from("clients").select("*").order("name"),
  sb.from("orders").select("*").order("order_number"),
  sb.from("cash_movements").select("*").order("movement_date")
 ]);
 for(const r of [p,c,o,m])if(r.error)throw r.error;
 db.products=(p.data||[]).map(x=>({id:x.id,name:x.name,qty:+x.quantity,min:+x.minimum_quantity,cost:+x.purchase_cost,sell:+x.public_price}));
 db.clients=c.data||[];
 db.movements=(m.data||[]).map(x=>({id:x.id,date:x.movement_date,type:x.movement_type==="Entrata"?"in":"out",amount:+x.amount,desc:x.description||"",orderId:x.order_id}));
 const raw=o.data||[];
 let items=[];
 if(raw.length){
  const r=await sb.from("order_items").select("*").in("order_id",raw.map(x=>x.id)).order("created_at");
  if(r.error)throw r.error;items=r.data||[];
 }
 db.orders=raw.map(x=>({id:x.id,number:x.order_number,customer:x.customer_name,phone:x.customer_phone||"",date:x.order_date,delivery:x.delivery_date||"",status:x.status,total:+x.total,cost:+x.total_cost,paid:+x.paid,items:items.filter(i=>i.order_id===x.id).map(i=>({id:i.id,productId:i.product_id,productName:i.product_name,qty:+i.quantity,cost:+i.purchase_cost_unit,sell:+i.public_price_unit,notes:i.personalization||"",image:""}))}));
}
async function boot(){try{await loadOnline();goNav("home")}catch(e){$("app").innerHTML=`<div class="card warn"><h2>Collegamento non riuscito</h2><p>${esc(e.message)}</p><button type="button" onclick="boot()">Riprova</button></div>`}}

function home(){
 const low=db.products.filter(p=>p.qty<=p.min),open=db.orders.filter(o=>o.status!=="Consegnato").length;
 const revenue=db.orders.reduce((a,o)=>a+o.total,0),cost=db.orders.reduce((a,o)=>a+o.cost,0),due=db.orders.reduce((a,o)=>a+Math.max(0,o.total-o.paid),0),cashIn=db.movements.filter(x=>x.type==="in").reduce((a,x)=>a+x.amount,0);
 $("app").innerHTML=`<div class="card" style="display:flex;align-items:center;gap:16px"><img src="logo.png" style="width:145px;max-height:100px;object-fit:contain"><div><h1 style="margin:0 0 5px">Dashboard</h1><div class="muted">Wood Garage 24 · gestionale online</div></div></div>
 <div class="grid"><div class="card stat"><div class="muted">Ordini aperti</div><div class="big">${open}</div></div><div class="card stat"><div class="muted">Vendite ordini</div><div class="big">${money(revenue)}</div><div class="small muted">Valore ordini, non incasso</div></div><div class="card stat"><div class="muted">Incassato reale</div><div class="big">${money(cashIn)}</div><div class="small muted">Solo pagamenti registrati</div></div><div class="card stat"><div class="muted">Margine lordo</div><div class="big">${money(revenue-cost)}</div></div><div class="card stat"><div class="muted">Da incassare</div><div class="big">${money(due)}</div></div></div>
 <div class="card ${low.length?'warn':'ok'}"><strong>${low.length?'⚠️ Prodotti da riordinare':'🟢 Magazzino sotto controllo'}</strong><div class="muted" style="margin-top:6px">${low.length?low.map(p=>`${esc(p.name)}: ${p.qty} rimasti · minimo ${p.min}`).join(" · "):"Nessun articolo sotto la scorta minima."}</div></div>
 <div class="card"><div class="row"><h2 style="margin:0">Ultimi ordini</h2><button type="button" onclick="goNav('orders')">Vedi tutti</button></div>${db.orders.length?`<div class="scroll"><table><tr><th>#</th><th>Cliente</th><th>Articoli</th><th>Totale</th><th>Stato</th></tr>${db.orders.slice().reverse().slice(0,8).map(o=>`<tr class="click" onclick="viewOrder('${o.id}')"><td>#${o.number}</td><td>${esc(o.customer)}</td><td>${o.items.length}</td><td>${money(o.total)}</td><td><span class="badge">${esc(o.status)}</span></td></tr>`).join("")}</table></div>`:`<div class="empty">Nessun ordine. Vai su Ordini per crearne uno.</div>`}</div>`;
}
function orders(){
 $("app").innerHTML=`<div class="row"><div><h1>Ordini</h1><div class="muted">Ordini online sincronizzati.</div></div><div class="actions" style="margin-top:0"><button type="button" onclick="printSelectedOrders()">🖨️ Stampa selezionati</button><button type="button" class="primary" onclick="newOrder()">＋ Nuovo ordine</button></div></div>
 <div class="card"><div class="grid2"><label>Cerca cliente<input id="searchOrder" oninput="renderOrderTable()" placeholder="Nome o telefono"></label><label>Stato<select id="filterStatus" onchange="renderOrderTable()"><option value="">Tutti</option><option>Nuovo</option><option>In lavorazione</option><option>In attesa approvazione</option><option>Pronto</option><option>Consegnato</option></select></label></div><div class="actions"><button type="button" onclick="selectAllOpenOrders()">☑️ Seleziona tutti gli ordini aperti</button><button type="button" onclick="clearOrderSelection()">Deseleziona tutti</button></div></div><div class="card scroll" id="orderTable"></div>`;
 renderOrderTable();
}
function renderOrderTable(){const q=($("searchOrder")?.value||"").toLowerCase(),s=$("filterStatus")?.value||"",rows=db.orders.filter(o=>(!q||`${o.customer} ${o.phone}`.toLowerCase().includes(q))&&(!s||o.status===s));$("orderTable").innerHTML=rows.length?`<table><tr><th>☑️</th><th>#</th><th>Data</th><th>Cliente</th><th>Articoli</th><th>Totale</th><th>Pagato</th><th>Da incassare</th><th>Stato</th><th></th></tr>${rows.slice().reverse().map(o=>`<tr><td>${o.status!=="Consegnato"?`<input class="order-check" type="checkbox" data-id="${o.id}" onchange="toggleOrderSelection(this.dataset.id,this.checked)">`: ""}</td><td>#${o.number}</td><td>${o.date||""}</td><td><b>${esc(o.customer)}</b><div class="small muted">${esc(o.phone)}</div></td><td>${o.items.length}</td><td>${money(o.total)}</td><td>${money(o.paid)}</td><td><b>${money(o.total-o.paid)}</b></td><td><span class="badge">${esc(o.status)}</span></td><td><button type="button" onclick="viewOrder('${o.id}')">Apri</button></td></tr>`).join("")}</table>`:`<div class="empty">Nessun ordine trovato.</div>`}

function toggleOrderSelection(id,checked){const s=window._selectedOrders||(window._selectedOrders=new Set());checked?s.add(id):s.delete(id)}
function selectAllOpenOrders(){window._selectedOrders=new Set(db.orders.filter(o=>o.status!=="Consegnato").map(o=>o.id));renderOrderTable()}
function clearOrderSelection(){window._selectedOrders=new Set();renderOrderTable()}
function printSelectedOrders(){
 const ids=[...(window._selectedOrders||new Set())];
 if(!ids.length)return alert("Seleziona almeno un ordine aperto.");
 const rows=ids.map(id=>db.orders.find(o=>o.id===id)).filter(Boolean);
 const printHtml=`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Ordini Wood Garage 24</title><style>
 body{font-family:Arial,sans-serif;color:#111;background:#fff;margin:0}
 .print-order{break-inside:avoid-page;border-bottom:2px solid #111;padding:0 0 18px;margin:0 0 18px}
 .head{display:flex;justify-content:space-between;border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:10px}
 .title{font-size:20px;font-weight:800}.muted{color:#666;font-size:12px}
 table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px;border-bottom:1px solid #eee;vertical-align:top}
 .right{text-align:right}.total{font-size:18px;font-weight:800;margin-top:10px}
 .print-actions{margin:20px 0;text-align:center}.print-actions button{padding:10px 16px;font-weight:700}
 @page{size:A4;margin:14mm}
 @media print{.print-actions{display:none!important}}
 </style></head><body>
 <div class="print-actions"><button type="button" onclick="window.print()">🖨️ Stampa</button><button type="button" onclick="window.close()">Chiudi</button></div>
 ${rows.map(o=>`<section class="print-order">
 <div class="head"><div><div class="title">WOOD GARAGE 24 — Ordine #${esc(o.number)}</div><div class="muted">Cliente: ${esc(o.customer)} ${o.phone?`· ${esc(o.phone)}`:""}</div></div>
 <div class="muted">Ordine: ${esc(o.date||"")}<br>Consegna: ${esc(o.delivery||"non indicata")}</div></div>
 <div class="muted">Stato: <b>${esc(o.status)}</b></div>
 <table><tr><th>Articolo</th><th>Personalizzazione</th><th>Qtà</th><th class="right">Prezzo</th><th class="right">Totale</th></tr>
 ${o.items.map(i=>`<tr><td><b>${esc(i.productName)}</b></td><td>${esc(i.notes||"—")}</td><td>${i.qty}</td><td class="right">${money(i.sell)}</td><td class="right">${money(i.sell*i.qty)}</td></tr>`).join("")}
 </table><div class="total">Totale: ${money(o.total)} · Pagato: ${money(o.paid)} · Da incassare: ${money(Math.max(0,o.total-o.paid))}</div>
 </section>`).join("")}
 </body></html>`;
 const w=window.open("","_blank");
 if(!w)return alert("Il browser ha bloccato la finestra. Consenti i popup per il gestionale.");
 w.document.open();
 w.document.write(printHtml);
 w.document.close();
 w.focus();
}
function nextNumber(){return Math.max(1000,...db.orders.map(o=>+o.number||0))+1}
function customerOptions(){return db.clients.map(c=>`<option value="${esc(c.name)}">${esc(c.phone||"")}</option>`).join("")}
function newOrder(){
 $("app").innerHTML=`<div class="row"><div><h1>Nuovo ordine #${nextNumber()}</h1><div class="muted">Più articoli nello stesso ordine.</div></div><button onclick="goNav('orders')">Annulla</button></div>
 <div class="card grid2">
 <label>Cliente *<input id="oc" list="customerList" placeholder="Cerca o seleziona cliente" oninput="fillCustomerPhone()"><datalist id="customerList">${customerOptions()}</datalist></label>
 <label>WhatsApp / telefono<input id="op" placeholder="Numero cliente"></label>
 <label>Data ordine<input id="od" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
 <label>Data consegna<input id="odel" type="date"></label>
 <label>Stato<select id="os"><option>Nuovo</option><option>In lavorazione</option><option>In attesa approvazione</option><option>Pronto</option><option>Consegnato</option></select></label>
 <label>Acconto €<input id="opaid" type="number" min="0" step=".01" value="0" oninput="calcOrder()"></label></div>
 <div class="card"><div class="row"><div><h2 style="margin:0">Articoli</h2><div class="muted">Ogni articolo ha personalizzazione e grafica proprie.</div></div><button class="primary" onclick="addItem()">＋ Aggiungi articolo</button></div><div id="items"></div></div>
 <div class="card"><h2>Riepilogo</h2><div id="sum" class="grid"></div><div class="actions"><button class="primary" onclick="saveOrder()">✓ Salva ordine</button></div></div>`;
 addItem();
}
function fillCustomerPhone(){const c=db.clients.find(x=>x.name.toLowerCase()===$("oc").value.trim().toLowerCase());if(c)$("op").value=c.phone||""}
function addItem(data={}){
 const el=document.createElement("div");el.className="article";el.dataset.id=uid();
 el.innerHTML=`<div class="row"><strong>Articolo</strong><button class="danger" onclick="this.closest('.article').remove();calcOrder()">Rimuovi</button></div>
 <div class="item-grid" style="margin-top:10px"><label>Prodotto<select class="prod">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}<option value="__new">Altro / nuovo</option></select></label><label>Quantità<input class="qty" type="number" min="1" value="${data.qty||1}"></label><label>Prezzo cliente €<input class="sell" type="number" min="0" step=".01" value="${data.sell??""}"></label></div>
 <label style="margin-top:10px">Personalizzazione<textarea class="notes" rows="2" placeholder="Nome, colori, scritte, misure...">${esc(data.notes||"")}</textarea></label>
 <div class="graphic-box"><strong>🎨 Grafica</strong><div class="muted small">L'originale resta per la produzione; al cliente mostrerai l'anteprima con filigrana.</div><input class="graphic-file" type="file" accept="image/png,image/jpeg,image/webp" style="margin-top:8px"><div class="graphic-preview-wrap"></div><div class="graphic-actions actions"></div></div>
 <div class="muted gapline" style="margin-top:8px"></div>`;
 $("items").appendChild(el);
 if(data.productId)el.querySelector(".prod").value=data.productId;
 const fill=()=>{const p=db.products.find(x=>x.id===el.querySelector(".prod").value);if(p && data.sell==null)el.querySelector(".sell").value=p.sell;calcOrder()};
 el.querySelector(".prod").onchange=fill;el.querySelectorAll("input,textarea").forEach(x=>x.addEventListener("input",calcOrder));el.querySelector(".graphic-file").addEventListener("change",()=>handleGraphicFile(el));fill();
}
function showGraphicPreview(el,url){el.querySelector(".graphic-preview-wrap").innerHTML=`<div class="graphic-preview"><img src="${url}" alt="Anteprima grafica"><div class="graphic-watermark">WOOD GARAGE 24</div></div>`;el.querySelector(".graphic-actions").innerHTML=`<button type="button" onclick="downloadGraphicPreview(this)">⬇️ Scarica anteprima filigranata</button>`}
function handleGraphicFile(el){const f=el.querySelector(".graphic-file").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{el.dataset.graphicData=r.result;el.dataset.graphicName=f.name;showGraphicPreview(el,r.result)};r.readAsDataURL(f)}
function downloadGraphicPreview(btn){const el=btn.closest(".article"),img=el.querySelector(".graphic-preview img"),c=document.createElement("canvas");const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(img,0,0,w,h);x.save();x.translate(w/2,h/2);x.rotate(-25*Math.PI/180);x.font=`bold ${Math.max(22,Math.round(Math.min(w,h)/10))}px Arial`;x.textAlign="center";x.fillStyle="rgba(255,255,255,.72)";x.strokeStyle="rgba(0,0,0,.45)";x.lineWidth=3;x.strokeText("WOOD GARAGE 24",0,0);x.fillText("WOOD GARAGE 24",0,0);x.restore();const a=document.createElement("a");a.href=c.toDataURL("image/jpeg",.9);a.download="anteprima-filigranata.jpg";a.click()}
function calcOrder(){let t=0;document.querySelectorAll(".article").forEach(a=>{const q=+a.querySelector(".qty").value||0,s=+a.querySelector(".sell").value||0;t+=q*s;a.querySelector(".gapline").textContent=`Totale articolo ${money(q*s)}`});const paid=num($("opaid")?.value);if($("sum"))$("sum").innerHTML=`<div><div class="muted">Totale ordine</div><div class="big">${money(t)}</div></div><div><div class="muted">Acconto</div><div class="big">${money(paid)}</div></div><div><div class="muted">Da incassare</div><div class="big">${money(Math.max(0,t-paid))}</div></div>`}
function collectItems(){return [...document.querySelectorAll(".article")].map(a=>{const pid=a.querySelector(".prod").value,p=db.products.find(x=>x.id===pid);return{productId:pid,productName:p?.name||"Altro / nuovo",qty:Math.max(1,num(a.querySelector(".qty").value)),cost:p?.cost||0,sell:Math.max(0,num(a.querySelector(".sell").value)),notes:a.querySelector(".notes").value.trim(),graphicData:a.dataset.graphicData||null,graphicName:a.dataset.graphicName||null}})}
async function uploadGraphic(orderId,itemId,data){if(!data)return null;const m=data.match(/^data:(image\/[^;]+);base64,(.+)$/);if(!m)return null;const mime=m[1],bytes=Uint8Array.from(atob(m[2]),c=>c.charCodeAt(0)),ext=mime.includes("png")?"png":mime.includes("webp")?"webp":"jpg",path=`${currentUser.id}/${orderId}/${itemId}/original.${ext}`,r=await sb.storage.from("wood-garage-grafiche").upload(path,bytes,{contentType:mime,upsert:true});if(r.error)throw r.error;return path}

async function saveEditedOrder(){
 try{
  const id=editingOrderId,o=db.orders.find(x=>x.id===id);if(!o)return;
  const customer=$("oc").value.trim(),items=collectItems();
  if(!customer||!items.length)return alert("Inserisci cliente e almeno un articolo.");
  const total=items.reduce((a,x)=>a+x.qty*x.sell,0),cost=items.reduce((a,x)=>a+x.qty*x.cost,0);
  const oldItems=o.items.slice();

  // Ripristina prima le quantità precedentemente scalate.
  for(const i of oldItems){
   if(i.productId){
    const p=db.products.find(x=>x.id===i.productId);
    if(p){const r=await sb.from("products").update({quantity:p.qty+i.qty}).eq("id",p.id);if(r.error)throw r.error;}
   }
  }

  const ur=await sb.from("orders").update({
   customer_name:customer,
   customer_phone:$("op").value.trim(),
   order_date:$("od").value,
   delivery_date:$("odel").value||null,
   status:$("os").value,
   total,
   total_cost:cost
  }).eq("id",id);
  if(ur.error)throw ur.error;

  const dr=await sb.from("order_items").delete().eq("order_id",id);
  if(dr.error)throw dr.error;

  const cl=db.clients.find(x=>x.name.toLowerCase()===customer.toLowerCase());
  if(!cl){
   const cr=await sb.from("clients").insert({name:customer,phone:$("op").value.trim()});
   if(cr.error)throw cr.error;
  }

  for(const i of items){
   const itemId=uid(),originalPath=await uploadGraphic(id,itemId,i.graphicData);
   const ir=await sb.from("order_items").insert({
    id:itemId,order_id:id,product_id:i.productId==="__new"?null:i.productId,
    product_name:i.productName,quantity:i.qty,purchase_cost_unit:i.cost,
    public_price_unit:i.sell,personalization:i.notes||null,original_graphic_path:originalPath
   });
   if(ir.error)throw ir.error;
   if(i.productId!=="__new"){
    const p=db.products.find(x=>x.id===i.productId);
    if(p){const rr=await sb.from("products").update({quantity:Math.max(0,p.qty-i.qty)}).eq("id",p.id);if(rr.error)throw rr.error;}
   }
  }
  await loadOnline();editingOrderId=null;toast("Modifiche salvate");viewOrder(id);
 }catch(e){fail(e)}
}

async function newSupply(){
 try{
  const opts=db.products.map((p,i)=>`${i+1}. ${p.name} — costo attuale ${money(p.cost)}`).join("\\n");
  if(!db.products.length)return alert("Prima crea almeno un prodotto in Magazzino.");
  const choice=prompt("Scegli il numero del prodotto:\\n\\n"+opts);
  const p=db.products[Number(choice)-1];if(!p)return;
  const qty=Math.max(0,num(prompt("Quantità acquistata","1")));if(!qty)return;
  const cost=num(prompt("Costo unitario di questo approvvigionamento",String(p.cost).replace(".", ",")));if(!(cost>=0))return;
  const date=prompt("Data approvvigionamento",new Date().toISOString().slice(0,10))||new Date().toISOString().slice(0,10);
  const total=qty*cost;
  const r=await sb.from("stock_movements").insert({product_id:p.id,movement_type:"Carico",quantity:qty,description:`Approvvigionamento — ${qty} × ${money(cost)} cad.`,created_by:currentUser.id});
  if(r.error)throw r.error;
  const ur=await sb.from("products").update({quantity:p.qty+qty,purchase_cost:cost}).eq("id",p.id);
  if(ur.error)throw ur.error;
  // Registriamo anche l'uscita economica dell'acquisto nella cassa.
  const cr=await sb.from("cash_movements").insert({movement_type:"Uscita",amount:total,movement_date:date,description:`Approvvigionamento ${p.name} — ${qty} × ${money(cost)}`,created_by:currentUser.id});
  if(cr.error)throw cr.error;
  await loadOnline();stock();toast(`Approvvigionamento registrato: ${qty} pezzi a ${money(cost)} cad.`);
 }catch(e){fail(e)}
}

function cash(){const inc=db.movements.filter(x=>x.type==="in").reduce((a,x)=>a+x.amount,0),out=db.movements.filter(x=>x.type==="out").reduce((a,x)=>a+x.amount,0);$("app").innerHTML=`<h1>Entrate / Uscite</h1><div class="grid"><div class="card stat"><div class="muted">Entrate</div><div class="big">${money(inc)}</div></div><div class="card stat"><div class="muted">Uscite</div><div class="big">${money(out)}</div></div><div class="card stat"><div class="muted">Saldo</div><div class="big">${money(inc-out)}</div></div></div><div class="card"><div class="actions"><button type="button" class="primary" onclick="movement('in')">＋ Entrata</button><button type="button" onclick="movement('out')">− Uscita</button></div><div class="scroll"><table><tr><th>Data</th><th>Tipo</th><th>Descrizione</th><th class="right">Importo</th></tr>${db.movements.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.type==="in"?"Entrata":"Uscita"}</td><td>${esc(x.desc)}</td><td class="right">${money(x.amount)}</td></tr>`).join("")||"<tr><td colspan=4 class=empty>Nessun movimento.</td></tr>"}</table></div></div>`}
async function movement(type){try{const a=+prompt(type==="in"?"Importo entrata":"Importo uscita","0");if(!(a>0))return;const r=await sb.from("cash_movements").insert({movement_type:type==="in"?"Entrata":"Uscita",amount:a,movement_date:new Date().toISOString().slice(0,10),description:prompt("Descrizione","")||"Movimento",created_by:currentUser.id});if(r.error)throw r.error;await loadOnline();cash();toast("Movimento registrato")}catch(e){fail(e)}}
function clients(){$("app").innerHTML=`<div class="row"><div><h1>Clienti</h1><div class="muted">Anagrafica clienti.</div></div><button type="button" class="primary" onclick="addClient()">＋ Nuovo cliente</button></div><div class="card scroll"><table><tr><th>Cliente</th><th>Telefono</th><th>Ordini</th><th>Vendite</th><th>Da incassare</th></tr>${db.clients.map(c=>{const os=db.orders.filter(o=>o.customer.toLowerCase()===c.name.toLowerCase()),sales=os.reduce((a,o)=>a+o.total,0),due=os.reduce((a,o)=>a+Math.max(0,o.total-o.paid),0);return`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||"")}</td><td>${os.length}</td><td>${money(sales)}</td><td>${money(due)}</td></tr>`}).join("")||"<tr><td colspan=5 class=empty>Nessun cliente.</td></tr>"}</table></div>`}
async function addClient(){try{const name=prompt("Nome e cognome");if(!name)return;const phone=prompt("Telefono / WhatsApp","")||"";const r=await sb.from("clients").insert({name:name.trim(),phone});if(r.error)throw r.error;await loadOnline();clients();toast("Cliente aggiunto")}catch(e){fail(e)}}
function backup(){$("app").innerHTML=`<h1>Dati</h1><div class="card"><h2>Account online</h2><p class="muted">Account: ${esc(currentUser?.email||"")}</p><button type="button" onclick="signout()">🚪 Esci</button></div><div class="card"><h2>Database</h2><p class="muted">Il database è online su Supabase. I dati principali vengono sincronizzati quando accedi con lo stesso account.</p></div>`}

(async function start(){
 try{
  const r=await sb.auth.getSession();if(r.error)throw r.error;
  if(r.data.session){currentUser=r.data.session.user;await boot()}else authScreen();
 }catch(e){$("app").innerHTML=`<div class="card warn"><h2>Errore di avvio</h2><p>${esc(e.message)}</p></div>`}
})();
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;authScreen()}});
</script>
